[project]
name = "airline-training-data-platform"
version = "0.1.0"
description = "DevOps learning slice: tenant-bound SQL Server snapshot to S3"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3", "python-tds", "pyOpenSSL", "certifi"]

[dependency-groups]
dev = ["pytest", "ruff", "python-hcl2", "PyYAML", "jsonschema", "pip-audit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
